name: Entenarchiv 4.6.18 Architecture Cleanup

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: entenarchiv-pages
  cancel-in-progress: false

jobs:
  cleanup:
    name: Architektur-Cleanup anwenden und pruefen
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Projekt laden
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Geprueften 4.6.18-Stand anwenden
        run: node ComicArchiv-4.6.18-architecture-cleanup.mjs

      - name: Vollstaendige Projekt-CI
        run: npm run ci

      - name: Einmalige Upgrade-Dateien entfernen
        run: |
          rm -f ComicArchiv-4.6.18-architecture-cleanup.mjs
          rm -f .github/workflows/run-4.6.18-architecture-cleanup.yml

      - name: Aenderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Keine Aenderungen zu committen."
          else
            git commit -m "chore: architecture cleanup 4.6.18"
          fi

      - name: Mit aktuellem main synchronisieren und erneut pruefen
        run: |
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "::error::main hat sich in einer von 4.6.18 geaenderten Datei weiterentwickelt. Es wurde nichts gepusht."
            exit 1
          fi
          npm run ci

      - name: Geprueften Stand pushen
        run: |
          if git push origin HEAD:main; then
            exit 0
          fi
          echo "main wurde direkt vor dem Push erneut aktualisiert. Ein sicherer zweiter Versuch folgt."
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "::error::Beim zweiten Synchronisationsversuch gab es einen echten Konflikt. Kein Force-Push."
            exit 1
          fi
          npm run ci
          git push origin HEAD:main

      - name: Pages-Paket bereitstellen
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    name: Entenarchiv 4.6.18 veroeffentlichen
    needs: cleanup
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: GitHub Pages veroeffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
