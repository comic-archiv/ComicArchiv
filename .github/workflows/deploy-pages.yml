name: Entenarchiv prüfen und veröffentlichen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: entenarchiv-pages
  cancel-in-progress: true

jobs:
  quality:
    name: Qualitätsprüfung
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Projekt laden
        uses: actions/checkout@v4
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Offizielle LTB-Jahrespläne prüfen
        if: github.event_name != 'pull_request'
        run: npm run calendar:sync
      - name: Dateien und Datenlogik prüfen
        run: npm run check
      - name: Sauberes Produktionspaket erstellen
        run: npm run build
      - name: Pages-Paket bereitstellen
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    name: GitHub Pages veröffentlichen
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Geprüfte Version veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
