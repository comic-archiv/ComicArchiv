name: Entenarchiv 4.5.3 Cascade Cleanup

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: entenarchiv-pages
  cancel-in-progress: true

jobs:
  cleanup:
    name: CSS Kaskade sicher bereinigen
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Projekt laden
        uses: actions/checkout@v7

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Cleanup-Parser selbst testen
        run: node ComicArchiv-4.5.3-cascade-cleanup.mjs --self-test

      - name: Cascade Cleanup anwenden
        run: node ComicArchiv-4.5.3-cascade-cleanup.mjs

      - name: Vollstaendige Projektpruefung
        run: npm run ci

      - name: Einmaliges Cleanup-Script entfernen
        run: rm -f ComicArchiv-4.5.3-cascade-cleanup.mjs

      - name: Aenderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Keine Aenderungen zu committen."
          else
            git commit -m "chore: remove redundant CSS cascade declarations"
            git push
          fi

      - name: Pages-Paket bereitstellen
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    name: Bereinigte Version veroeffentlichen
    needs: cleanup
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: GitHub Pages veroeffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
