name: Entenarchiv 4.6.1 Settings Split

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: entenarchiv-data-stack-write
  cancel-in-progress: false

jobs:
  settings-split:
    name: Settings Split spiegeln und pruefen
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Projekt laden
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Geprueften 4.6.1-Stand anwenden
        run: node ComicArchiv-4.6.1-settings-split.mjs

      - name: Vollstaendige Projekt-CI
        run: npm run ci

      - name: Einmalige Installer-Dateien entfernen
        run: |
          rm -f ComicArchiv-4.6.1-settings-split.mjs
          rm -f .github/workflows/run-4.6.1-settings-split.yml

      - name: Commit vorbereiten
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Keine Aenderungen zu committen."
            exit 0
          fi
          git commit -m "feat: mirror settings into data stack stores"

      - name: Mit aktuellem main synchronisieren und erneut pruefen
        run: |
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "::error::main hat sich in einer von 4.6.1 betroffenen Datei geaendert. Es wurde nichts gepusht."
            exit 1
          fi
          npm run ci

      - name: Geprueften Commit pushen
        run: |
          if ! git push origin HEAD:main; then
            echo "main wurde direkt vor dem Push aktualisiert. Sicherer zweiter Versuch folgt."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Konflikt beim zweiten Synchronisationsversuch. Es wurde nichts ueberschrieben."
              exit 1
            fi
            npm run ci
            git push origin HEAD:main
          fi
