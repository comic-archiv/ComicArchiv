name: Entenarchiv 4.6.21 Mobile Density Hotfix

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: entenarchiv-pages
  cancel-in-progress: false

jobs:
  hotfix:
    name: Mobile UI verdichten und pruefen
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Projekt laden
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: 4.6.21 Mobile Density Hotfix anwenden
        run: node ComicArchiv-4.6.21-mobile-density-hotfix.mjs

      - name: Vollstaendige Projekt-CI
        run: npm run ci

      - name: Einmalige Hotfix-Artefakte entfernen
        run: |
          rm -f ComicArchiv-4.6.21-mobile-density-hotfix.mjs
          rm -f .github/workflows/run-4.6.21-mobile-density-hotfix.yml

      - name: Hotfix committen und mit aktuellem main synchronisieren
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix: tighten mobile app chrome"
          fi
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "::error::main hat sich in einer betroffenen Datei geändert. Es wurde nichts gepusht."
            exit 1
          fi

      - name: Finalen Stand erneut pruefen
        run: npm run ci

      - name: Hotfix pushen
        run: git push origin HEAD:main

      - name: Pages-Paket bereitstellen
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    name: GitHub Pages veroeffentlichen
    needs: hotfix
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Gepruefte Version veroeffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
