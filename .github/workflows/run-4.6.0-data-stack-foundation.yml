name: Entenarchiv 4.6.0 Data Stack Foundation

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: entenarchiv-data-stack-foundation-write
  cancel-in-progress: false

jobs:
  foundation:
    name: Schema 6 vorbereiten und vollstaendig pruefen
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Projekt laden
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Gepruefte Data-Stack-Foundation anwenden
        run: node ComicArchiv-4.6.0-data-stack-foundation.mjs

      - name: Foundation vollstaendig pruefen
        run: npm run ci

      - name: Einmalige Foundation-Dateien entfernen
        run: |
          rm -f ComicArchiv-4.6.0-data-stack-foundation.mjs
          rm -f .github/workflows/run-4.6.0-data-stack-foundation.yml

      - name: Foundation committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Keine Aenderungen zu committen."
            exit 0
          fi

          git commit -m "feat: add Data Stack v2 foundation"

          # Unmittelbar vor dem Push den aktuellen main integrieren. Kein Force-Push.
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "::error::main hat sich in einer von 4.6.0 beruehrten Datei geaendert. Es wurde nichts gepusht."
            exit 1
          fi

      - name: Finalen rebasierten Stand erneut pruefen
        run: npm run ci

      - name: Foundation sicher nach main pushen
        run: |
          if ! git push origin HEAD:main; then
            echo "main wurde direkt vor dem Push erneut aktualisiert. Ein sicherer zweiter Versuch folgt."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Der zweite Synchronisationsversuch hatte einen echten Konflikt. Es wurde nichts ueberschrieben."
              exit 1
            fi
            npm run ci
            git push origin HEAD:main
          fi
