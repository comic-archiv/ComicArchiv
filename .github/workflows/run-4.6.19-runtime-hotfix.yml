name: Entenarchiv 4.6.19 Runtime Hotfix

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: entenarchiv-pages
  cancel-in-progress: false

jobs:
  hotfix:
    name: Runtime Hotfix anwenden und pruefen
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Projekt laden
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Geprueften 4.6.19-Hotfix anwenden
        run: node ComicArchiv-4.6.19-runtime-hotfix.mjs

      - name: Vollstaendige Projekt-CI
        run: npm run ci

      - name: Einmalige Hotfix-Artefakte entfernen
        run: |
          rm -f ComicArchiv-4.6.19-runtime-hotfix.mjs
          rm -f .github/workflows/run-4.6.19-runtime-hotfix.yml

      - name: Hotfix committen und mit aktuellem main synchronisieren
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Keine Aenderungen zu committen."
          else
            git commit -m "fix: repair runtime scope after 4.6.18 split"
          fi

          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "::error::main hat sich in einer vom Hotfix betroffenen Datei geaendert. Es wurde nichts gepusht."
            exit 1
          fi

      - name: Nach Synchronisierung erneut vollstaendig pruefen
        run: npm run ci

      - name: Hotfix pushen
        run: |
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo "main ist bereits aktuell."
          else
            git push origin HEAD:main
          fi

      - name: Pages-Paket bereitstellen
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    name: GitHub Pages veroeffentlichen
    needs: hotfix
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Gepruefte Version veroeffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
