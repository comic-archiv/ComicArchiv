name: Entenarchiv 4.6.3 Settings Cutover

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: entenarchiv-pages
  cancel-in-progress: true

jobs:
  cutover:
    name: Settings Cutover anwenden und pruefen
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Projekt laden
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Geprueften 4.6.3-Stand anwenden
        run: node ComicArchiv-4.6.3-settings-cutover.mjs

      - name: Vollstaendige Projekt-CI
        run: npm run ci

      - name: Einmaligen Installer und Workflow entfernen
        run: |
          rm -f ComicArchiv-4.6.3-settings-cutover.mjs
          rm -f .github/workflows/run-4.6.3-settings-cutover.yml

      - name: Commit vorbereiten und mit aktuellem main synchronisieren
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Keine Aenderungen zu committen."
          else
            git commit -m "refactor: cut over split settings stores"
          fi
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "::error::main hat sich in einer betroffenen Datei geaendert. Es wurde nichts gepusht."
            exit 1
          fi

      - name: CI nach Synchronisierung erneut pruefen
        run: npm run ci

      - name: Sicher nach main pushen
        run: |
          if ! git push origin HEAD:main; then
            echo "main wurde unmittelbar vor dem Push aktualisiert. Sicherer zweiter Versuch."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Konflikt beim zweiten Synchronisationsversuch. Es wurde nichts ueberschrieben."
              exit 1
            fi
            npm run ci
            git push origin HEAD:main
          fi

      - name: Pages-Paket bereitstellen
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    name: GitHub Pages veroeffentlichen
    needs: cutover
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Gepruefte 4.6.3-Version veroeffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
