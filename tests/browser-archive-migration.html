<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entenarchiv Browser-Migrationstest</title>
</head>
<body>
  <pre id="result">Test läuft …</pre>
  <script type="module">
    const output = document.querySelector("#result");
    const DATABASE_NAME = "comicarchiv-db-test";

    function requestResult(request) {
      return new Promise((resolve, reject) => {
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error || new Error("IndexedDB-Anfrage fehlgeschlagen."));
      });
    }

    function transactionDone(transaction) {
      return new Promise((resolve, reject) => {
        transaction.oncomplete = () => resolve();
        transaction.onerror = () => reject(transaction.error || new Error("IndexedDB-Transaktion fehlgeschlagen."));
        transaction.onabort = () => reject(transaction.error || new Error("IndexedDB-Transaktion abgebrochen."));
      });
    }

    async function deleteDatabase() {
      await new Promise((resolve, reject) => {
        const request = indexedDB.deleteDatabase(DATABASE_NAME);
        request.onsuccess = () => resolve();
        request.onerror = () => reject(request.error || new Error("Testdatenbank konnte nicht gelöscht werden."));
        request.onblocked = () => reject(new Error("Testdatenbank ist blockiert."));
      });
    }

    async function seedLegacyDatabase() {
      const database = await new Promise((resolve, reject) => {
        const request = indexedDB.open(DATABASE_NAME, 4);
        request.onupgradeneeded = () => {
          const db = request.result;
          const comics = db.createObjectStore("comics", { keyPath: "id" });
          comics.createIndex("series", "series", { unique: false });
          comics.createIndex("numericBandNumber", "numericBandNumber", { unique: false });
          comics.createIndex("updatedAt", "updatedAt", { unique: false });
          db.createObjectStore("settings", { keyPath: "key" });
          const covers = db.createObjectStore("coverMedia", { keyPath: "comicId" });
          covers.createIndex("updatedAt", "updatedAt", { unique: false });
          const metadata = db.createObjectStore("metadataCache", { keyPath: "key" });
          metadata.createIndex("fetchedAt", "fetchedAt", { unique: false });
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error || new Error("Legacy-Testdatenbank konnte nicht angelegt werden."));
      });

      const transaction = database.transaction(["comics", "settings", "coverMedia"], "readwrite");
      const comics = transaction.objectStore("comics");
      const timestampA = "2025-01-01T12:00:00.000Z";
      const timestampB = "2025-02-01T12:00:00.000Z";
      comics.put({
        id: "legacy-239-a",
        dataFormatVersion: 8,
        series: "Lustiges Taschenbuch",
        volumeNumber: "239",
        numericBandNumber: 239,
        title: "60 turbulente Jahre",
        publicationYear: 1997,
        condition: "1",
        duplicateCondition: "2",
        isRead: true,
        isDuplicate: true,
        isSealed: false,
        notes: "Erstes Exemplar",
        createdAt: timestampA,
        updatedAt: timestampA
      });
      comics.put({
        id: "legacy-239-b",
        dataFormatVersion: 8,
        series: "LTB",
        volumeNumber: "00239",
        numericBandNumber: 239,
        title: "60 turbulente Jahre mit Tick, Trick und Track",
        publicationYear: 1997,
        condition: "3",
        duplicateCondition: null,
        isRead: false,
        isDuplicate: false,
        isSealed: true,
        notes: "Drittes Exemplar",
        createdAt: timestampB,
        updatedAt: timestampB
      });
      transaction.objectStore("settings").put({
        key: "app",
        value: {
          theme: "dark",
          customSeries: [],
          seriesDefinitions: []
        }
      });
      transaction.objectStore("coverMedia").put({
        comicId: "legacy-239-b",
        blob: new Blob(["cover-test"], { type: "image/jpeg" }),
        mimeType: "image/jpeg",
        size: 10,
        width: 10,
        height: 10,
        source: "user",
        updatedAt: timestampB
      });
      await transactionDone(transaction);
      database.close();
    }

    function assert(condition, message) {
      if (!condition) throw new Error(message);
    }

    try {
      await deleteDatabase();
      await seedLegacyDatabase();

      const storage = await import(`../storage.js?browser-test=${Date.now()}`);
      const migratedComics = await storage.getAllComics();
      const archive = await storage.getArchiveGraph();
      const status = await storage.getArchiveCoreStatus();
      const snapshot = await storage.getLatestMigrationSnapshot();

      assert(status.ready === true, "Archivkern wurde nicht erfolgreich aktiviert.");
      assert(status.justMigrated === true, "Erster Start wurde nicht als Migration erkannt.");
      assert(migratedComics.length === 1, "Doppelte Altdatensätze wurden nicht zu einer Ausgabe zusammengeführt.");
      assert(archive.issues.length === 1, "Es wurde nicht genau eine Ausgabe angelegt.");
      assert(archive.copies.length === 3, "Die drei physischen Exemplare wurden nicht erhalten.");
      assert(archive.issues[0].seriesId === "ltb-main", "Die Hauptreihe erhielt nicht ihre stabile ID.");
      assert(snapshot?.comics?.length === 2, "Der Rückfall-Schnappschuss enthält nicht beide Altdatensätze.");

      const cover = await storage.getCoverMedia(archive.issues[0].id);
      assert(Boolean(cover?.blob), "Das eigene Cover wurde nicht auf die neue Ausgaben-ID umgehängt.");

      await storage.saveComic({
        id: "neuer-scan-239",
        seriesId: "ltb-main",
        series: "Lustiges Taschenbuch",
        volumeNumber: "239",
        numericBandNumber: 239,
        title: "60 turbulente Jahre mit Tick, Trick und Track",
        publicationYear: 1997,
        condition: "2-3",
        isRead: false,
        isDuplicate: false,
        isSealed: false,
        notes: "Viertes Exemplar",
        copies: [{
          id: "copy-vier",
          issueId: "neuer-scan-239",
          condition: "2-3",
          isRead: false,
          isSealed: false,
          notes: "Viertes Exemplar",
          displayOrder: 1,
          createdAt: "2026-08-07T12:00:00.000Z",
          updatedAt: "2026-08-07T12:00:00.000Z"
        }],
        createdAt: "2026-08-07T12:00:00.000Z",
        updatedAt: "2026-08-07T12:00:00.000Z"
      });

      const afterScan = await storage.getArchiveGraph();
      assert(afterScan.issues.length === 1, "Ein erneuter Scan hat fälschlich eine zweite Ausgabe angelegt.");
      assert(afterScan.copies.length === 4, "Das vierte Exemplar wurde nicht ergänzt.");

      output.textContent = JSON.stringify({
        ok: true,
        issueId: afterScan.issues[0].id,
        seriesId: afterScan.issues[0].seriesId,
        issues: afterScan.issues.length,
        copies: afterScan.copies.length,
        remappedCovers: cover ? 1 : 0,
        snapshot: Boolean(snapshot)
      });
      document.documentElement.dataset.testStatus = "passed";
    } catch (error) {
      output.textContent = JSON.stringify({
        ok: false,
        error: error instanceof Error ? error.message : String(error)
      });
      document.documentElement.dataset.testStatus = "failed";
      throw error;
    }
  </script>
</body>
</html>
